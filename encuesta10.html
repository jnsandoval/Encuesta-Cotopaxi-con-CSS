<!DOCTYPE html>
<html>
<head>
  <title>Encuesta Parque Nacional Cotopaxi</title>
</head>
<body>

<h2>Encuesta de Satisfaccion del Visitante - Parque Nacional Cotopaxi</h2>

<form action="/action_page.php">

  <!-- Pregunta 1: Nombre y apellido -->
  <label for="nombre">Nombre y apellido:</label><br>
  <input type="text" id="nombre" name="nombre"><br><br>

  <!-- Pregunta 2: Fecha de la visita -->
  <label for="fecha">Fecha de la visita:</label><br>
  <input type="date" id="fecha" name="fecha"><br><br>

  <!-- Pregunta 3: Tipo de visitante -->
  <p>Tipo de visitante:</p>
  <input type="radio" id="nacional" name="tipo_visitante" value="nacional">
  <label for="nacional">Turista nacional</label><br>
  <input type="radio" id="internacional" name="tipo_visitante" value="internacional">
  <label for="internacional">Turista internacional</label><br><br>

  <!-- Pregunta 4: Rango de presupuesto -->
  <label for="presupuesto">Rango de presupuesto gastado:</label><br>
  <select id="presupuesto" name="presupuesto">
    <option value="menos20">Menos de $20 USD</option>
    <option value="20-50">$20 - $50 USD</option>
    <option value="51-100">$51 - $100 USD</option>
    <option value="mas100">Mas de $100 USD</option>
  </select><br><br>

  <!-- Pregunta 5: Servicios e instalaciones -->
  <p>Servicios e instalaciones que utilizo:</p>
  <input type="checkbox" id="servicio1" name="servicio1" value="centro">
  <label for="servicio1"> Centro de interpretacion / Museo</label><br>
  <input type="checkbox" id="servicio2" name="servicio2" value="banos">
  <label for="servicio2"> Servicios higienicos (Banios)</label><br>
  <input type="checkbox" id="servicio3" name="servicio3" value="cafeteria">
  <label for="servicio3"> Tienda de artesanias o cafeteria</label><br>
  <input type="checkbox" id="servicio4" name="servicio4" value="parqueadero">
  <label for="servicio4"> Zonas de parqueadero</label><br>
  <input type="checkbox" id="servicio5" name="servicio5" value="picnic">
  <label for="servicio5"> Areas de picnic / Camping</label><br><br>

  <!-- Pregunta 6: Calificacion de senderos -->
  <label for="calificacion">Calificacion del estado de los senderos (1 al 5):</label><br>
  <input type="number" id="calificacion" name="calificacion" min="1" max="5"><br><br>

  <!-- Pregunta 7: Hora de ingreso -->
  <label for="horario">Seleccione su hora de ingreso:</label><br>
  <input type="time" id="horario" name="horario"><br><br>

  <!-- Pregunta 8: Correo electronico -->
  <label for="email">Correo electronico de contacto:</label><br>
  <input type="email" id="email" name="email"><br><br>

  <!-- Pregunta 9: Sugerencias o comentarios -->
  <label for="sugerencias">Sugerencias o comentarios:</label><br>
  <textarea id="sugerencias" name="sugerencias" rows="4" cols="50"></textarea><br><br>

  <!-- Pregunta 10: Aceptacion de terminos y botones de envio -->
  <input type="checkbox" id="terminos" name="terminos" value="acepto">
  <label for="terminos"> Acepto los terminos y politicas de privacidad</label><br><br>

  <input type="submit" value="Submit">
  <input type="reset" value="Reset">

</form>

</body>
</html>
