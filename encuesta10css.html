<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta Parque Nacional Cotopaxi</title>

  <!-- CSS de Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <!-- ISO 9126: Atractivo visual y Operabilidad (Enmarcado claro con bordes verdes e interacción) -->
        <div class="card border border-success border-2 rounded-4 shadow-sm overflow-hidden">
          
          <!-- Encabezado con alta legibilidad -->
          <div class="card-header bg-success text-white text-center py-4 border-0">
            <h2 class="h4 fw-bold mb-1">Parque Nacional Cotopaxi</h2>
            <p class="small mb-0 opacity-75">Encuesta de Satisfacción del Visitante</p>
          </div>

          <div class="card-body p-4">
            <form action="/action_page.php" class="vstack gap-2">

              <!-- ISO 9126: Comprensibilidad - Pregunta 1 -->
              <div class="form-field">
                <label for="nombre" class="form-label fw-semibold text-dark">1. Nombre y apellido:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Juan Pérez">
                <div class="form-text">Ingrese su nombre completo para registrar su visita.</div>
              </div>

              <!-- Pregunta 2 -->
              <div class="form-field">
                <label for="fecha" class="form-label fw-semibold text-dark">2. Fecha de la visita:</label>
                <input type="date" class="form-control" id="fecha" name="fecha">
              </div>

              <!-- ISO 9126: Aprendibilidad/Operabilidad - Agrupamiento visual contenido -->
              <div class="form-group">
                <label class="form-label fw-semibold text-dark">3. Tipo de visitante:</label>
                <div class="vstack gap-2 p-3 bg-light rounded-3 border">
                  <div class="form-field mb-0">
                    <input type="radio" id="nacional" class="radio" name="tipo_visitante" value="nacional">
                    <label for="nacional">Turista nacional</label>
                  </div>
                  <div class="form-field mb-0">
                    <input type="radio" id="internacional" class="radio" name="tipo_visitante" value="internacional">
                    <label for="internacional">Turista internacional</label>
                  </div>
                </div>
              </div>

              <!-- Pregunta 4 -->
              <div class="form-field">
                <label for="presupuesto" class="form-label fw-semibold text-dark">4. Rango de presupuesto gastado:</label>
                <select class="form-control" id="presupuesto" name="presupuesto">
                  <option selected disabled>Seleccione una opción…</option>
                  <option value="menos20">Menos de $20 USD</option>
                  <option value="20-50">$20 - $50 USD</option>
                  <option value="51-100">$51 - $100 USD</option>
                  <option value="mas100">Más de $100 USD</option>
                </select>
              </div>

              <!-- Pregunta 5 -->
              <div class="form-group">
                <label class="form-label fw-semibold text-dark">5. Servicios e instalaciones que utilizó:</label>
                <div class="vstack gap-2 p-3 bg-light rounded-3 border">
                  <div class="form-field mb-0">
                    <input type="checkbox" id="servicio1" class="check" name="servicio1" value="centro">
                    <label for="servicio1">Centro de interpretación / Museo</label>
                  </div>
                  <div class="form-field mb-0">
                    <input type="checkbox" id="servicio2" class="check" name="servicio2" value="banos">
                    <label for="servicio2">Servicios higiénicos (Baños)</label>
                  </div>
                  <div class="form-field mb-0">
                    <input type="checkbox" id="servicio3" class="check" name="servicio3" value="cafeteria">
                    <label for="servicio3">Tienda de artesanías o cafetería</label>
                  </div>
                  <div class="form-field mb-0">
                    <input type="checkbox" id="servicio4" class="check" name="servicio4" value="parqueadero">
                    <label for="servicio4">Zonas de parqueadero</label>
                  </div>
                  <div class="form-field mb-0">
                    <input type="checkbox" id="servicio5" class="check" name="servicio5" value="picnic">
                    <label for="servicio5">Áreas de picnic / Camping</label>
                  </div>
                </div>
              </div>

              <!-- Pregunta 6 -->
              <div class="form-field">
                <label for="calificacion" class="form-label fw-semibold text-dark">6. Calificación del estado de los senderos (1 al 5):</label>
                <input type="number" class="form-control" id="calificacion" name="calificacion" min="1" max="5" placeholder="Del 1 al 5">
                <div class="form-text">Donde 1 es deficiente y 5 es excelente.</div>
              </div>

              <!-- Pregunta 7 -->
              <div class="form-field">
                <label for="horario" class="form-label fw-semibold text-dark">7. Hora de ingreso:</label>
                <input type="time" class="form-control" id="horario" name="horario">
              </div>

              <!-- Pregunta 8 -->
              <div class="form-field">
                <label for="email" class="form-label fw-semibold text-dark">8. Correo electrónico de contacto:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="nombre@ejemplo.com">
                <div class="form-text">No compartiremos su correo electrónico con nadie más.</div>
              </div>

              <!-- Pregunta 9 -->
              <div class="form-field">
                <label for="sugerencias" class="form-label fw-semibold text-dark">9. Sugerencias o comentarios:</label>
                <textarea class="form-control" id="sugerencias" name="sugerencias" rows="3" placeholder="Asegúrese de incluir detalles relevantes sobre su experiencia..."></textarea>
              </div>

              <!-- Pregunta 10 -->
              <div class="form-field p-3 bg-light rounded-3 border my-2">
                <input type="checkbox" id="terminos" class="check" name="terminos" value="acepto" required>
                <div class="form-field-content">
                  <label for="terminos" class="fw-semibold text-dark">Términos y condiciones</label>
                  <small class="form-text">Acepto el tratamiento de datos para fines estadísticos del parque.</small>
                </div>
              </div>

              <!-- ISO 9126: Operabilidad (Botones claramente diferenciados) -->
              <div class="d-flex justify-content-end gap-2 pt-2">
                <button type="reset" class="btn btn-outline-secondary px-4">Limpiar</button>
                <button type="submit" class="btn-solid theme-primary px-4">Enviar Encuesta</button>
              </div>

            </form>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
